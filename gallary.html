<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>أعمالنا | محسن الونش</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/gallary.css">

</head>

<body>


    <!-- Gallery Header -->

    <section class="gallery-header">

        <!-- Back Home -->

        <a href="index.html" class="back-home" aria-label="العودة للرئيسية" title="العودة للرئيسية">

            <i class="fa-solid fa-house"></i>

        </a>


        <span>
            أعمالنا
        </span>

        <h1>
            شغلنا على أرض الواقع
        </h1>

        <p>
            مجموعة من أعمالنا في تنفيذ وتركيب الأنظمة الكهربائية
            والإضاءة واللوحات والتشطيبات المختلفة.
        </p>

    </section>


    <!-- Gallery -->

    <section class="gallery-page">

        <a href="index.html#works" class="back-works">
            <i class="fa-solid fa-arrow-right"></i>
            <span>الرجوع إلي أعمالنا</span>
        </a>

        <div class="gallery-grid" id="galleryGrid">

        </div>

    </section>

    <!-- Lightbox -->

    <div class="lightbox" id="lightbox">


        <!-- Close -->

        <button class="lightbox-close" id="lightboxClose" aria-label="إغلاق">

            <i class="fa-solid fa-xmark"></i>

        </button>


        <!-- Previous -->

        <button class="lightbox-arrow prev" id="lightboxPrev">

            <i class="fa-solid fa-chevron-right"></i>

        </button>


        <!-- Image -->

        <img src="" alt="" id="lightboxImg">


        <!-- Play -->

        <button class="lightbox-play" id="lightboxPlay" aria-label="تشغيل العرض التلقائي">

            <i class="fa-solid fa-play"></i>

        </button>


        <!-- Next -->

        <button class="lightbox-arrow next" id="lightboxNext" aria-label="الصورة التالية">

            <i class="fa-solid fa-chevron-left"></i>

        </button>


    </div>


    <!-- JavaScript -->


    <script src="js/gallary.js"></script>

</body>

</html>
